; This file holds every route from the API

; Route format: 
; [<authenticated> <method> <endpoint>]
; What method should be called for this endpoint
; handler = <Class>::<Method>
; body = '{"<parameter_name>":"<type>"}' (optional)

; Endpoint format:
; /<endpoint-name>/{<Some Parameter>}/...

; Endpoint Rules:
; An Endpoint should always start with '/'
; An Endpoint can have multiple parameters or no parameters
; Parameters can be anywhere in the endpoint and should always be enclosed by {}

; Endpoint naming practices:
; The endpoint should start with the name of the controller
; and then the endpoint name
; Example: /accounts/login

; Example routes:

; Example (non authenticated):
; [GET /get-routes]
; handler = GeneralController::getRoutes

; Example (Request with body):
; [POST /accounts/login]
; handler = AccountController::login
; body = '{"username":"string","password":"string"}'

; Example (Authenticated Request):
; [* GET /get-user]
; handler = UserController::login
; body = '{"username":"string","password":"string"}'

; Observações:
; Em rotas autenticadas, você sempre precisa passar o 'refresh_token'

[GET /get-routes]
handler = TestController::testMethod
body = '{"something_required": "string", "?something_optional": "string"}'

; User Related Routes
[GET /get-user/{user_id}]
handler = UserController::getUser

[POST /create-account]
handler = UserController::createAccount
body = '{"reg": "string", "password": "string", "username": "string", "name": "string"}'

[* POST /accounts/get-data]
handler = UserController::getAccountData

[* POST /accounts/update]
handler = UserController::updateAccountData
body = '{"?password": "string", "?username": "string", "?name": "string"}'

; Rotas específicas para chefia

; Para criar o usuário da chefia, as informações de usuário padrão também são necessárias
; TODO: Adicionar as informações extras da chefia
[GET /get-chief/{user_id}]
handler = ChiefController::getChief

[POST /chief/create-account]
handler = ChiefController::createAccount
body = '{"reg": "string", "password": "string", "username": "string", "name": "string"}'

[* POST /accounts/chief/get-data]
handler = ChiefController::getAccountData

; TODO: Adicionar as informações extras da chefia
[* POST /accounts/chief/update]
handler = ChiefController::updateAccountData
body = '{"?password": "string", "?username": "string", "?name": "string"}'


; Account / Session related
[POST /accounts/login]
handler = AuthController::startSession
body = '{"reg": "string", "password": "string"}'

[POST /accounts/refresh]
handler = AuthController::refreshSession
body = '{"refresh_token": "string"}'

[POST /accounts/alive]
handler = AuthController::checkSessionStats
body = '{"refresh_token": "string"}'

[POST /accounts/quit]
handler = AuthController::quitSession
body = '{"refresh_token": "string"}'


[* POST /groups/create]
handler = GroupController::createGroup
body = '{"state": "string", "name": "string", "num": "int"}'

[* POST /groups/update]
handler = GroupController::updateGroup
body = '{"?state": "string", "?name": "string", "?num": "int"}'

[* POST /groups/delete]
handler = GroupController::deleteGroup

[* POST /groups/join/{id_group}]
handler = GroupController::joinGroup
# body = '{"id_group": "int"}'

[* POST /groups/quit]
handler = GroupController::quitGroup