; Account / Session related
[POST /accounts/login]
handler = AuthController::startSession
body = '{"reg": "string", "password": "string"}'

[POST /accounts/refresh]
handler = AuthController::refreshSession
body = '{"refresh_token": "string"}'

[POST /accounts/alive]
handler = AuthController::checkSessionStats
body = '{"refresh_token": "string"}'

[POST /accounts/quit]
handler = AuthController::quitSession
body = '{"refresh_token": "string"}'


